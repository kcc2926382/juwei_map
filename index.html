<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海珠区居委地址查询</title>
    <!-- 引入 Leaflet 样式和脚本 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- 引入 Turf.js 用于空间判断 -->
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; }
        #map { height: 600px; width: 100%; }
        .search-bar {
            position: absolute;
            top: 10px;
            left: 50px;
            z-index: 1000;
            background: white;
            padding: 10px 15px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            display: flex;
            gap: 10px;
        }
        .search-bar input {
            width: 300px;
            padding: 8px;
            font-size: 14px;
        }
        .search-bar button {
            padding: 8px 15px;
            background: #1e73be;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .result {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            z-index: 1000;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="search-bar">
        <input type="text" id="addressInput" placeholder="请输入海珠区地址, 例如: 江南大道中100号" style="width: 300px;">
        <button id="searchBtn">搜索</button>
    </div>
    <div id="map"></div>
    <div class="result" id="resultDiv"></div>

    <script>
       // 1. 初始化地图，中心点设为海珠区大致范围（经度，纬度）
var map = L.map('map').setView([23.095, 113.324], 12);

// 使用高德矢量底图（GCJ-02坐标系）
L.tileLayer('https://webrd02.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
    attribution: '&copy; <a href="https://www.amap.com/">高德地图</a>',
    subdomains: '1234',
    maxZoom: 18
}).addTo(map);
var geojsonData = null;      // 存储原始数据
var juweiLayer = null;       // 存储地图上的居委图层
var highlightLayer = null;   // 用于高亮选中的居委

// 使用 fetch 加载本地的 geojson 文件
fetch('haizhu_juwei_gcj02.geojson')
    .then(response => response.json())
    .then(data => {
        geojsonData = data;
        // 添加居委边界到地图，初始样式：淡蓝色边框，很浅的填充
        juweiLayer = L.geoJSON(data, {
            style: {
                color: '#3388ff',
                weight: 1.5,
                fillColor: '#6699cc',
                fillOpacity: 0.1
            },
            onEachFeature: function(feature, layer) {
                // 鼠标悬浮显示居委名称
                var name = feature.properties.name || feature.properties.居委会名称 || '未知居委';
                layer.bindTooltip(name);
            }
        }).addTo(map);
        console.log('居委数据加载完成，共', data.features.length, '个');
    })
    .catch(error => {
        console.error('加载居委数据失败:', error);
        document.getElementById('resultDiv').innerHTML = '⚠️ 居委数据加载失败，请检查文件路径';
    });
    // 高德Web服务Key（替换为你的真实Key）
const AMAP_KEY = '3def8a3843f47bb19a74cbaea6fe33dd';

async function geocodeAddress(address) {
    const url = `https://restapi.amap.com/v3/geocode/geo?address=${encodeURIComponent(address)}&output=JSON&key=${AMAP_KEY}`;
    const response = await fetch(url);
    const data = await response.json();
    if (data.status === '1' && data.geocodes.length > 0) {
        var location = data.geocodes[0].location; // "经度,纬度"
        var lngLat = location.split(',');
        return { lng: parseFloat(lngLat[0]), lat: parseFloat(lngLat[1]) };
    } else {
        throw new Error('地址解析失败: ' + (data.info || '未知错误'));
    }
}
function findJuweiByPoint(lng, lat) {
    if (!geojsonData) return null;
    var point = turf.point([lng, lat]);
    for (var i = 0; i < geojsonData.features.length; i++) {
        var feature = geojsonData.features[i];
        if (turf.booleanPointInPolygon(point, feature.geometry)) {
            return feature;
        }
    }
    return null;
}
function highlightJuwei(feature) {
    if (highlightLayer) {
        map.removeLayer(highlightLayer);
    }
    highlightLayer = L.geoJSON(feature, {
        style: {
            color: 'red',
            weight: 4,
            fillColor: '#ff8888',
            fillOpacity: 0.5
        }
    }).addTo(map);
}
async function searchAddress() {
    var address = document.getElementById('addressInput').value.trim();
    if (address === '') {
        alert('请输入地址');
        return;
    }
    document.getElementById('resultDiv').innerHTML = '🔍 查询中...';
    try {
        // 1. 地址转坐标
        var coord = await geocodeAddress(address);
        // 2. 地图移动到该点，添加标记
        map.setView([coord.lat, coord.lng], 16);
        // 移除旧的临时标记（可选，用全局变量存储以避免重复添加）
        if (window.currentMarker) map.removeLayer(window.currentMarker);
        window.currentMarker = L.marker([coord.lat, coord.lng]).addTo(map)
            .bindPopup(address).openPopup();
        
        // 3. 查找所属居委
        var juwei = findJuweiByPoint(coord.lng, coord.lat);
        if (juwei) {
            var juweiName = juwei.properties.name || juwei.properties.居委会名称 || '未命名';
            document.getElementById('resultDiv').innerHTML = `✅ 地址：${address}<br>🏘️ 所属居委：${juweiName}`;
            highlightJuwei(juwei);
        } else {
            document.getElementById('resultDiv').innerHTML = `❌ 未找到所属居委（可能地址不在海珠区边界内）`;
            // 清除高亮
            if (highlightLayer) map.removeLayer(highlightLayer);
        }
    } catch (err) {
        console.error(err);
        document.getElementById('resultDiv').innerHTML = `⚠️ 查询失败：${err.message}`;
    }
}
document.getElementById('searchBtn').addEventListener('click', searchAddress);
// 支持按回车键搜索
document.getElementById('addressInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') searchAddress();
});

    </script>
</body>
</html>
